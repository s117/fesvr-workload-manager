[project]
name = "fwm"
version = "0.0.1"
description = "RISCV workload manager for simulating with Anycore infrastructure."
authors = [{ name = "Jiayang Li", email = "jli95@ncsu.edu" }]
license = { text = "Other/Proprietary License" }
readme = "README.md"
keywords = ["riscv", "fesvr", "simenv", "anycore"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "click>=8.4.0",
    "peewee>=4.5.0",
    "pydantic>=2.9.0",
]

[project.urls]
Repository = "https://github.com/s117/fesvr-workload-manager.git"

[project.scripts]
fwm = "fwm.cli.fwm:cli"

[dependency-groups]
dev = [
    "tox",
    "tox-uv",
    "pytest>=7.4",
    "pytest-sugar",
    "pytest-cov",
    "pyfakefs>=5.6.0",
    "black",
    "mypy",
    "ruff",
    "isort",
    "types-peewee>=3.17.6.20240813",
    "types-colorama>=0.4.15.20240311",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fwm"
module-root = ""

[tool.mypy]
# tests import helpers as tests.<module>, so map files to modules from the project root
explicit_package_bases = true

[tool.ruff.lint]
# ruff's former default rules, which this code follows; newer ruff releases select more by default
select = ["E4", "E7", "E9", "F"]
