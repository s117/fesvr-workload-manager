[tox]
requires =
    tox>=4
    tox-uv
env_list =
    py{312,313,314}
    lint
    type
    coverage

[testenv]
description = run the tests with pytest
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    pytest {posargs:tests}

[testenv:type]
description = run type checks
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    mypy {posargs:fwm tests}

[testenv:lint]
description = run linter
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    ruff check {posargs:fwm tests}

[testenv:coverage]
description = run coverage report
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    pytest --cov=fwm tests/
